<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 96 832 832" width="832" height="832">
  <!-- Kliq's app icon: a warm, tactile key with a lightly hand-cut edge. The bold
       geometry stays legible at menu and Dock sizes; the small accents keep its voice. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#EEE8DE"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F05242"/>
      <stop offset="1" stop-color="#DF3E34"/>
    </linearGradient>
    <filter id="tile-shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <filter id="key-shadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#35140F" flood-opacity=".20"/>
    </filter>
    <filter id="hand-edge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="1" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="cap-clip">
      <path d="M344,268H680A104,104 0 0 1 784,372V660A104,104 0 0 1 680,764H344A104,104 0 0 1 240,660V372A104,104 0 0 1 344,268Z"/>
    </clipPath>
  </defs>

  <path d="M285,100H739A185,185 0 0 1 924,285V739A185,185 0 0 1 739,924H285A185,185 0 0 1 100,739V285A185,185 0 0 1 285,100Z"
        fill="url(#tile)" filter="url(#tile-shadow)"/>
  <path d="M285,100H739A185,185 0 0 1 924,285V739A185,185 0 0 1 739,924H285A185,185 0 0 1 100,739V285A185,185 0 0 1 285,100Z"
        fill="none" stroke="#31251F" stroke-opacity=".13" stroke-width="4"/>

  <g transform="rotate(-4 512 512)" filter="url(#hand-edge)">
    <!-- A restrained navy print offset makes the key read as a physical object. -->
    <path d="M344,268H680A104,104 0 0 1 784,372V660A104,104 0 0 1 680,764H344A104,104 0 0 1 240,660V372A104,104 0 0 1 344,268Z"
          transform="translate(18 22)" fill="#273A5D" filter="url(#key-shadow)"/>
    <path d="M344,268H680A104,104 0 0 1 784,372V660A104,104 0 0 1 680,764H344A104,104 0 0 1 240,660V372A104,104 0 0 1 344,268Z"
          fill="#C93B31"/>

    <!-- Two intentional flashes replace the old all-over texture at small sizes. -->
    <path d="M267,352C345,310 422,295 500,298" fill="none" stroke="#F5B92E" stroke-width="25"
          stroke-linecap="round" clip-path="url(#cap-clip)"/>
    <path d="M618,748C682,728 733,696 771,654" fill="none" stroke="#F5B92E" stroke-width="24"
          stroke-linecap="round" clip-path="url(#cap-clip)"/>

    <path d="M382,316H642A72,72 0 0 1 714,388V584A72,72 0 0 1 642,656H382A72,72 0 0 1 310,584V388A72,72 0 0 1 382,316Z"
          fill="url(#face)" stroke="#FF7765" stroke-opacity=".62" stroke-width="7"/>

    <!-- A custom geometric K, widened so it survives the 16 px favicon. -->
    <path d="M435,392V580M565,390L463,487L574,581" fill="none" stroke="#F8F3E9" stroke-width="48"
          stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
</svg>
